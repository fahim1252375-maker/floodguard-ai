name: Package Devpost source ZIP
on:
  push:
    paths:
      - '.github/workflows/package-devpost.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source archive
        run: |
          zip -r /tmp/FloodGuard-AI-Devpost.zip . \
            -x '.git/*' \
               '.github/*' \
               'node_modules/*' \
               '**/node_modules/*' \
               'dist/*' \
               '**/dist/*' \
               'coverage/*' \
               '**/coverage/*' \
               '.env' \
               '**/.env'
          mv /tmp/FloodGuard-AI-Devpost.zip ./FloodGuard-AI-Devpost.zip
          unzip -t FloodGuard-AI-Devpost.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FloodGuard-AI-Devpost
          path: FloodGuard-AI-Devpost.zip
          if-no-files-found: error
          retention-days: 7
