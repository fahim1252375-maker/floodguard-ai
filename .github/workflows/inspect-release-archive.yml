name: Migrate and verify FloodGuard source

on:
  push:
    branches:
      - chore/professional-source-layout

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/professional-source-layout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract source archive
        if: hashFiles('FloodGuard_AI_v0.2.0.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/floodguard-source"
          unzip -q "$GITHUB_WORKSPACE/FloodGuard_AI_v0.2.0.zip" -d "$RUNNER_TEMP/floodguard-source"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/floodguard-source" -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)"
          test -f "$PROJECT_ROOT/src/App.tsx"
          test -f "$PROJECT_ROOT/src/views/SafetyPlanView.tsx"
          test -f "$PROJECT_ROOT/src/components/AccessibilityToggle.tsx"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Apply focused TypeScript fixes
        if: hashFiles('FloodGuard_AI_v0.2.0.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PROJECT_ROOT"])

          repo = root / "server/repo.ts"
          source = repo.read_text()
          for old, new in [
              (" as StationThresholdRow[]", " as unknown as StationThresholdRow[]"),
              (" as EventRow | undefined", " as unknown as EventRow | undefined"),
              (" as EventRow[]", " as unknown as EventRow[]"),
              (" as SubscriberRow;", " as unknown as SubscriberRow;"),
              (" as SubscriberRow | undefined", " as unknown as SubscriberRow | undefined"),
              (" as SubscriberRow[]", " as unknown as SubscriberRow[]"),
          ]:
              source = source.replace(old, new)
          repo.write_text(source)

          river = root / "src/utils/riverDischarge.ts"
          source = river.read_text()
          for old, new in [
              ("meanDischargeM3s: sylhetCurrent.meanDischargeM3s,", "meanDischargeM3s: sylhetCurrent.meanDischargeM3s ?? 420,"),
              ("maxDischargeM3s: sylhetCurrent.maxDischargeM3s,", "maxDischargeM3s: sylhetCurrent.maxDischargeM3s ?? Math.round(420 * 2.2),"),
              ("dischargeRatio: sylhetCurrent.dischargeRatio,", "dischargeRatio: sylhetCurrent.dischargeRatio ?? sylhetCurrent.dischargeM3s / 420,"),
              ("surgeStatus: classifySurgeStatus(sylhetCurrent.dischargeRatio),", "surgeStatus: classifySurgeStatus(sylhetCurrent.dischargeRatio ?? sylhetCurrent.dischargeM3s / 420),"),
              ("stationId: 'sylhet',", "stationId: 'sylhet',\n        dataAvailable: true,\n        dataDate: sylhetCurrent.date,"),
              ("meanDischargeM3s: sunamganjCurrent.meanDischargeM3s,", "meanDischargeM3s: sunamganjCurrent.meanDischargeM3s ?? 510,"),
              ("maxDischargeM3s: sunamganjCurrent.maxDischargeM3s,", "maxDischargeM3s: sunamganjCurrent.maxDischargeM3s ?? Math.round(510 * 2.2),"),
              ("dischargeRatio: sunamganjCurrent.dischargeRatio,", "dischargeRatio: sunamganjCurrent.dischargeRatio ?? sunamganjCurrent.dischargeM3s / 510,"),
              ("surgeStatus: classifySurgeStatus(sunamganjCurrent.dischargeRatio),", "surgeStatus: classifySurgeStatus(sunamganjCurrent.dischargeRatio ?? sunamganjCurrent.dischargeM3s / 510),"),
              ("stationId: 'sunamganj',", "stationId: 'sunamganj',\n        dataAvailable: true,\n        dataDate: sunamganjCurrent.date,"),
          ]:
              if old not in source:
                  raise SystemExit(f"Expected river expression not found: {old}")
              source = source.replace(old, new, 1)
          river.write_text(source)

          trends = root / "src/utils/stationTrends.ts"
          source = trends.read_text()
          pattern = r"if \(!points \|\| points\.length < 2\) \{\s*const base = points\?\.\[0\]\?\.waterLevel \?\? station\.currentWaterLevel;"
          replacement = """const validPoints = (points ?? []).filter(
            (point): point is StationTrendPoint & { waterLevel: number } =>
              typeof point.waterLevel === 'number' && Number.isFinite(point.waterLevel)
          );

          if (validPoints.length < 2) {
            const base = validPoints[0]?.waterLevel ?? station.currentWaterLevel;"""
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch station trend null filtering")
          for old, new in [
              ("const windowSize = Math.min(5, points.length);", "const windowSize = Math.min(5, validPoints.length);"),
              ("const recentPoints = points.slice(-windowSize);", "const recentPoints = validPoints.slice(-windowSize);"),
              ("const lastPoint = points[points.length - 1];", "const lastPoint = validPoints[validPoints.length - 1];"),
          ]:
              if old not in source:
                  raise SystemExit(f"Expected trend expression not found: {old}")
              source = source.replace(old, new, 1)
          trends.write_text(source)
          PY

      - name: Synchronize lockfile and install dependencies
        if: hashFiles('FloodGuard_AI_v0.2.0.zip') != ''
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Run TypeScript, unit, server, and production checks
        if: hashFiles('FloodGuard_AI_v0.2.0.zip') != ''
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm run lint
          npm run test:all
          npm run build

      - name: Publish verified source tree to migration branch
        if: hashFiles('FloodGuard_AI_v0.2.0.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' "$PROJECT_ROOT/" "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/FloodGuard_AI_v0.2.0.zip"
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          files = [
              "docs/COMBINATION_RELEASE_REPORT.md",
              "src/utils/healthRisk.test.ts",
              "submission/demo-script.md",
              "submission/devpost-text.md",
          ]
          for name in files:
              path = root / name
              if path.exists():
                  lines = [line.rstrip() for line in path.read_text().splitlines()]
                  path.write_text("\n".join(lines).rstrip() + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: migrate FloodGuard source archive"
          git push origin chore/professional-source-layout
