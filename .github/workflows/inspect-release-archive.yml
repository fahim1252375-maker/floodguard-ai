name: Verify archived FloodGuard source

on:
  push:
    branches:
      - chore/professional-source-layout

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract release source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/floodguard-release"
          unzip -q "$GITHUB_WORKSPACE/FloodGuard_AI_v0.2.0.zip" -d "$RUNNER_TEMP/floodguard-release"
          PROJECT_ROOT="$RUNNER_TEMP/floodguard-release/floodguard-ai-fullstack"
          test -f "$PROJECT_ROOT/package.json"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Synchronize lockfile, install dependencies, and run checks
        shell: bash
        run: |
          set +e
          cd "$PROJECT_ROOT"
          STATUS=0

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/lockfile.log" 2>&1
          LOCK_STATUS=$?
          if [ "$LOCK_STATUS" -ne 0 ]; then STATUS=1; fi

          if [ "$LOCK_STATUS" -eq 0 ]; then
            npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm-ci.log" 2>&1
            CI_STATUS=$?
          else
            CI_STATUS=not-run
          fi
          if [ "$CI_STATUS" != "0" ]; then STATUS=1; fi

          if [ "$CI_STATUS" = "0" ]; then
            npm run lint > "$RUNNER_TEMP/lint.log" 2>&1
            LINT_STATUS=$?
            if [ "$LINT_STATUS" -ne 0 ]; then STATUS=1; fi

            npm run test:all > "$RUNNER_TEMP/tests.log" 2>&1
            TEST_STATUS=$?
            if [ "$TEST_STATUS" -ne 0 ]; then STATUS=1; fi

            npm run build > "$RUNNER_TEMP/build.log" 2>&1
            BUILD_STATUS=$?
            if [ "$BUILD_STATUS" -ne 0 ]; then STATUS=1; fi
          else
            LINT_STATUS=not-run
            TEST_STATUS=not-run
            BUILD_STATUS=not-run
          fi

          {
            echo "FloodGuard AI v0.2.0 verification"
            echo "==============================="
            echo "Lockfile sync: $LOCK_STATUS"
            echo "npm ci: $CI_STATUS"
            echo "TypeScript lint: $LINT_STATUS"
            echo "All tests: $TEST_STATUS"
            echo "Production build: $BUILD_STATUS"
            for item in lockfile npm-ci lint tests build; do
              log="$RUNNER_TEMP/$item.log"
              if [ -f "$log" ]; then
                echo
                echo "===== $item.log ====="
                cat "$log"
              fi
            done
          } | tee "$GITHUB_WORKSPACE/quality-report.txt"

          exit "$STATUS"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floodguard-release-quality-report
          path: quality-report.txt
          if-no-files-found: warn
