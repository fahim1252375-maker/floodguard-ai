name: Migrate and verify FloodGuard source

on:
  push:
    branches:
      - chore/professional-source-layout

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: !contains(github.event.head_commit.message, 'chore: migrate FloodGuard source archive')
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/professional-source-layout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/floodguard-source"
          unzip -q "$GITHUB_WORKSPACE/FloodGuard_AI_v0.2.0.zip" -d "$RUNNER_TEMP/floodguard-source"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/floodguard-source" -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)"
          test -f "$PROJECT_ROOT/src/App.tsx"
          test -f "$PROJECT_ROOT/src/views/SafetyPlanView.tsx"
          test -f "$PROJECT_ROOT/src/components/AccessibilityToggle.tsx"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Apply focused TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(__import__("os").environ["PROJECT_ROOT"])

          def replace_once(path: str, old: str, new: str) -> None:
              file = root / path
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f"Expected source block not found in {path}; refusing an unsafe patch")
              file.write_text(source.replace(old, new, 1))

          repo = root / "server/repo.ts"
          source = repo.read_text()
          source = source.replace(" as StationThresholdRow[]", " as unknown as StationThresholdRow[]")
          source = source.replace(" as EventRow | undefined", " as unknown as EventRow | undefined")
          source = source.replace(" as EventRow[]", " as unknown as EventRow[]")
          source = source.replace(" as SubscriberRow;", " as unknown as SubscriberRow;")
          source = source.replace(" as SubscriberRow | undefined", " as unknown as SubscriberRow | undefined")
          source = source.replace(" as SubscriberRow[]", " as unknown as SubscriberRow[]")
          repo.write_text(source)

          replace_once(
              "src/utils/riverDischarge.ts",
              """        meanDischargeM3s: sylhetCurrent.meanDischargeM3s,
                  maxDischargeM3s: sylhetCurrent.maxDischargeM3s,
                  dischargeRatio: sylhetCurrent.dischargeRatio,
                  surgeStatus: classifySurgeStatus(sylhetCurrent.dischargeRatio),""",
              """        meanDischargeM3s: sylhetCurrent.meanDischargeM3s ?? 420,
                  maxDischargeM3s: sylhetCurrent.maxDischargeM3s ?? Math.round(420 * 2.2),
                  dischargeRatio: sylhetCurrent.dischargeRatio ?? sylhetCurrent.dischargeM3s / 420,
                  surgeStatus: classifySurgeStatus(sylhetCurrent.dischargeRatio ?? sylhetCurrent.dischargeM3s / 420),"""
          )
          replace_once(
              "src/utils/riverDischarge.ts",
              """        meanDischargeM3s: sunamganjCurrent.meanDischargeM3s,
                  maxDischargeM3s: sunamganjCurrent.maxDischargeM3s,
                  dischargeRatio: sunamganjCurrent.dischargeRatio,
                  surgeStatus: classifySurgeStatus(sunamganjCurrent.dischargeRatio),""",
              """        meanDischargeM3s: sunamganjCurrent.meanDischargeM3s ?? 510,
                  maxDischargeM3s: sunamganjCurrent.maxDischargeM3s ?? Math.round(510 * 2.2),
                  dischargeRatio: sunamganjCurrent.dischargeRatio ?? sunamganjCurrent.dischargeM3s / 510,
                  surgeStatus: classifySurgeStatus(sunamganjCurrent.dischargeRatio ?? sunamganjCurrent.dischargeM3s / 510),"""
          )

          replace_once(
              "src/utils/stationTrends.ts",
              """  if (!points || points.length < 2) {
                const base = points?.[0]?.waterLevel ?? station.currentWaterLevel;""",
              """  const validPoints = (points ?? []).filter(
                (point): point is StationTrendPoint & { waterLevel: number } =>
                  typeof point.waterLevel === 'number' && Number.isFinite(point.waterLevel)
              );

              if (validPoints.length < 2) {
                const base = validPoints[0]?.waterLevel ?? station.currentWaterLevel;"""
          )
          replace_once(
              "src/utils/stationTrends.ts",
              """  const windowSize = Math.min(5, points.length);
              const recentPoints = points.slice(-windowSize);""",
              """  const windowSize = Math.min(5, validPoints.length);
              const recentPoints = validPoints.slice(-windowSize);"""
          )
          replace_once(
              "src/utils/stationTrends.ts",
              """  const lastPoint = points[points.length - 1];
              const lastLevel = lastPoint.waterLevel;""",
              """  const lastPoint = validPoints[validPoints.length - 1];
              const lastLevel = lastPoint.waterLevel;"""
          )
          PY

      - name: Synchronize lockfile and install dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Run TypeScript, unit, server, and production checks
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm run lint
          npm run test:all
          npm run build

      - name: Publish verified source tree to migration branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' "$PROJECT_ROOT/" "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/FloodGuard_AI_v0.2.0.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: migrate FloodGuard source archive"
          git push origin chore/professional-source-layout
