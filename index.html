<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection warnings in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || (reason && reason.stack && reason.stack.indexOf('@vite/client') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1 || (event.filename && event.filename.indexOf('@vite/client') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
    <title>FloodGuard AI | Community Flood & Health Preparedness</title>
    <meta name="description" content="A bilingual flood-health preparedness prototype for Bangladesh, combining weather context, transparent risk indicators, community reports and response-planning tools." />
